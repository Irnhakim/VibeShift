<!DOCTYPE html>
<html>
<head>
  <title>VibeShift Icon Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: #ebdcb9;
      color: #1a1a1a;
    }
    .btn {
      background: #ffb3c1;
      border: 2px solid #1a1a1a;
      box-shadow: 4px 4px 0px #1a1a1a;
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      margin-top: 20px;
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #1a1a1a;
    }
  </style>
</head>
<body>
  <h2>VibeShift PNG Icon Generator</h2>
  <p>Google Chrome requires <strong>PNG format</strong> for extension icons in the management page (chrome://extensions/).</p>
  <p>Click the button below to generate and download all 4 required PNG sizes:</p>
  <button class="btn" onclick="generateIcons()">Generate & Download Icons</button>

  <script>
    const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .outline { stroke: #1a1a1a; stroke-width: 20; stroke-linejoin: round; stroke-linecap: round; }
    .moon { fill: #ffe066; }
    .star { fill: #ffd43b; }
    .cloud-front { fill: #f8f9fa; }
    .cloud-back { fill: #e9ecef; }
  </style>
  <path class="moon outline" d="M 170,110 A 170,170 0 1,0 350,370 A 145,145 0 1,1 170,110 Z" />
  <path class="star outline" d="M 300,40 L 312,70 L 345,70 L 320,90 L 332,120 L 300,100 L 268,120 L 280,90 L 255,70 L 288,70 Z" />
  <path class="cloud-back outline" d="M 330,170 C 320,130 400,110 430,140 C 430,130 470,135 470,165 C 470,195 440,205 420,205 L 330,205 Z" />
  <path class="cloud-front outline" d="M 70,360 C 65,300 200,290 220,350 C 220,320 280,320 280,380 C 280,440 210,450 190,450 L 70,450 C 40,450 20,420 20,395 C 20,370 50,360 70,360 Z" />
  <path class="star outline" d="M 430,390 L 440,415 L 468,415 L 446,432 L 456,458 L 430,440 L 404,458 L 414,432 L 392,415 L 420,415 Z" />
</svg>`;

    function generateIcons() {
      const img = new Image();
      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      
      img.onload = function() {
        const sizes = [16, 32, 48, 128];
        sizes.forEach(size => {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, size, size);
          
          const a = document.createElement('a');
          a.download = `icon${size}.png`;
          a.href = canvas.toDataURL('image/png');
          a.click();
        });
      };
      img.src = url;
    }
  </script>
</body>
</html>
