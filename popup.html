<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeShift - Audio Customizer</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-container">
        <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <style>
            .outline-logo { stroke: var(--border-color); stroke-width: 25; stroke-linejoin: round; stroke-linecap: round; }
            .moon-logo { fill: var(--accent-yellow); }
            .star-logo { fill: var(--accent-yellow); }
            .cloud-front-logo { fill: #f8f9fa; }
            .cloud-back-logo { fill: #e9ecef; }
          </style>
          <path class="moon-logo outline-logo" d="M 170,110 A 170,170 0 1,0 350,370 A 145,145 0 1,1 170,110 Z" />
          <path class="star-logo outline-logo" d="M 300,40 L 312,70 L 345,70 L 320,90 L 332,120 L 300,100 L 268,120 L 280,90 L 255,70 L 288,70 Z" />
          <path class="cloud-back-logo outline-logo" d="M 330,170 C 320,130 400,110 430,140 C 430,130 470,135 470,165 C 470,195 440,205 420,205 L 330,205 Z" />
          <path class="cloud-front-logo outline-logo" d="M 70,360 C 65,300 200,290 220,350 C 220,320 280,320 280,380 C 280,440 210,450 190,450 L 70,450 C 40,450 20,420 20,395 C 20,370 50,360 70,360 Z" />
          <path class="star-logo outline-logo" d="M 430,390 L 440,415 L 468,415 L 446,432 L 456,458 L 430,440 L 404,458 L 414,432 L 392,415 L 420,415 Z" />
        </svg>
        <span class="logo-text">VibeShift</span>
      </div>
      <div class="header-actions">
        <button id="power-btn" class="icon-btn active" title="Toggle Extension ON/OFF">
          <span style="font-size: 1.1rem; font-weight: bold;">⏻</span>
        </button>
        <button id="theme-btn" class="icon-btn" title="Toggle Mode">
          <span class="moon-icon">🌙</span>
        </button>
      </div>
    </header>

    <!-- Sliders Container (Vertical) -->
    <div class="sliders-section">
      <!-- Speed Slider -->
      <div class="slider-wrapper">
        <div class="slider-track-container">
          <input type="range" id="speed" min="0.5" max="2.0" step="0.05" value="1.0" class="vertical-slider">
          <div class="slider-fill" id="speed-fill"></div>
        </div>
        <div class="slider-label">Speed</div>
        <div class="slider-value" id="speed-val">1.0x</div>
      </div>

      <!-- Pitch Slider -->
      <div class="slider-wrapper">
        <div class="slider-track-container">
          <input type="range" id="pitch" min="-12" max="12" step="1" value="0" class="vertical-slider">
          <div class="slider-fill" id="pitch-fill"></div>
        </div>
        <div class="slider-label">Pitch</div>
        <div class="slider-value" id="pitch-val">0 st</div>
      </div>

      <!-- Reverb Slider -->
      <div class="slider-wrapper">
        <div class="slider-track-container">
          <input type="range" id="reverb" min="0" max="100" step="1" value="0" class="vertical-slider">
          <div class="slider-fill" id="reverb-fill"></div>
        </div>
        <div class="slider-label">Reverb</div>
        <div class="slider-value" id="reverb-val">0%</div>
      </div>

      <!-- Bass Slider -->
      <div class="slider-wrapper">
        <div class="slider-track-container">
          <input type="range" id="bass" min="-10" max="15" step="1" value="0" class="vertical-slider">
          <div class="slider-fill" id="bass-fill"></div>
        </div>
        <div class="slider-label">Bass</div>
        <div class="slider-value" id="bass-val">0 dB</div>
      </div>

      <!-- Mid Slider (EQ) -->
      <div class="slider-wrapper">
        <div class="slider-track-container">
          <input type="range" id="mid" min="-10" max="15" step="1" value="0" class="vertical-slider">
          <div class="slider-fill" id="mid-fill"></div>
        </div>
        <div class="slider-label">Mid</div>
        <div class="slider-value" id="mid-val">0 dB</div>
      </div>

      <!-- Treble Slider (EQ) -->
      <div class="slider-wrapper">
        <div class="slider-track-container">
          <input type="range" id="treble" min="-10" max="15" step="1" value="0" class="vertical-slider">
          <div class="slider-fill" id="treble-fill"></div>
        </div>
        <div class="slider-label">Treble</div>
        <div class="slider-value" id="treble-val">0 dB</div>
      </div>
    </div>

    <!-- Toggles Grid Section -->
    <div class="toggles-grid">
      <!-- 8D Audio Toggle -->
      <div class="toggle-row">
        <span class="toggle-label">8D Audio Spatial</span>
        <label class="switch">
          <input type="checkbox" id="toggle-8d">
          <span class="switch-slider"></span>
        </label>
      </div>

      <!-- Karaoke Toggle -->
      <div class="toggle-row">
        <span class="toggle-label">Karaoke Mode</span>
        <label class="switch">
          <input type="checkbox" id="toggle-karaoke">
          <span class="switch-slider"></span>
        </label>
      </div>
    </div>

    <!-- Presets Grid Section -->
    <div class="presets-section">
      <div class="preset-row">
        <button id="btn-reset" class="preset-btn">Reset</button>
        <button id="btn-slowed" class="preset-btn">Slowed</button>
        <button id="btn-nightcore" class="preset-btn">Nightcore</button>
      </div>
      <div class="preset-row">
        <button id="btn-bass-boost" class="preset-btn">Bass Boost</button>
        <button id="btn-vocal-boost" class="preset-btn">Vocal Boost</button>
        <button id="btn-8d" class="preset-btn">8D Preset</button>
      </div>
    </div>

    <!-- Footer Support Section -->
    <div class="support-title">support me ?</div>
    <div class="support-buttons-row">
      <a href="https://saweria.co/irnhakim" target="_blank" class="support-btn saweria-btn">
        👑 Saweria
      </a>
      <a href="https://buymeacoffee.com/irnhakim" target="_blank" class="support-btn bmac-btn">
        ☕ Coffee
      </a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
